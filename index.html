<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MySafeHaven - Preparedness Assessment</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

  <!-- LANDING -->
  <div id="landing" class="screen active">
    <h1>72h Household Resilience Check</h1>

    <p>
      Understand your vulnerability in a major disruption
      and get a personalized action plan.
    </p>

    <!-- IMPORTANT: must match function name in app.js -->
    <button onclick="startQuiz()">Start Assessment</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen">

    <h2 id="question"></h2>

    <div id="options"></div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <p>
      Step <span id="currentStep">1</span> / 4
    </p>

  </div>

  <!-- RESULT -->
  <div id="result" class="screen">

    <h1>Your Resilience Score</h1>

    <div class="score-circle">
      <div class="score" id="score">0%</div>
    </div>

    <!-- BREAKDOWN -->
    <div id="breakdown"></div>

    <!-- PLAN -->
    <div id="plan"></div>

    <!-- PAYWALL (static for now) -->
    <div class="paywall">

      <h3>🚨 Full 7-Day Emergency Plan Locked</h3>

      <p>
        Unlock your full personalized preparedness roadmap.
      </p>

      <button onclick="unlockPremium()" class="cta">
        Unlock Full Plan
      </button>

    </div>

    <button onclick="startQuiz()">Restart</button>

  </div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- APP -->
<script src="app.js"></script>

</body>
</html>
